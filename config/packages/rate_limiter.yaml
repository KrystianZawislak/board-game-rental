framework:
    rate_limiter:
        # per-IP limit on reservation requests (anti-spam)
        reservation:
            policy: 'sliding_window'
            limit: 5
            interval: '10 minutes'
            cache_pool: 'rate_limiter.cache'
    cache:
        pools:
            rate_limiter.cache:
                adapter: cache.app

when@test:
    framework:
        cache:
            pools:
                # in-memory limiter state in tests, reset on every kernel boot
                rate_limiter.cache:
                    adapter: cache.adapter.array
